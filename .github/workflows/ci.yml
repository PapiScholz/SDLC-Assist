name: ci
on: { push: { branches: [main] }, pull_request: {}, workflow_dispatch: {} }
permissions: { contents: read }
concurrency: { group: "ci-${{ github.ref }}", cancel-in-progress: true }
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - run: node --version
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1
      - run: bash scripts/gates.sh
  install-smoke:
    # What Task 21 did by hand: install through the skills CLI from a clean home,
    # then run the installed copy against a scratch production repo.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1
      - name: Install from this checkout into a temporary home
        run: |
          export HOME="$RUNNER_TEMP/home"; mkdir -p "$HOME"; cd "$HOME"
          # -g: without it the CLI installs into <cwd>/.agents/skills (project scope)
          npx -y skills add "$GITHUB_WORKSPACE" -y -g --copy
          test -f "$HOME/.agents/skills/sdlc/bin/where.js"
          test -f "$HOME/.agents/skills/spec-driven-development/SKILL.md"
          for s in sdlc-debugging sdlc-qa-gate sdlc-release; do test -f "$HOME/.agents/skills/$s/SKILL.md" || { echo "missing $s"; exit 1; }; done
      - name: Installed copy infers a production complaint as analysis
        run: |
          export HOME="$RUNNER_TEMP/home"
          fx="$RUNNER_TEMP/fx"; mkdir -p "$fx/src"; cd "$fx"
          git init -q --initial-branch=main
          git config user.name t; git config user.email t@t
          echo x > src/index.js; printf '# Changelog\n\n## [1.2.0] - 2026-01-01\n' > CHANGELOG.md
          git add -A; git commit -qm init; git tag v1.2.0
          printf 'un cliente se queja de que la app se rompió al pagar' > "$RUNNER_TEMP/msg.txt"
          node "$HOME/.agents/skills/sdlc/bin/where.js" --root "$fx" --message-file "$RUNNER_TEMP/msg.txt" > out.json
          node -e "const j=require('./out.json'); if(j.inferred!=='analysis'||j.request.type!=='complaint'||!j.signals.inProduction||j.signals.adr.exists||j.signals.adr.count!==0||j.signals.architecture.exists){console.error(JSON.stringify(j,null,1));process.exit(1)}; console.log('ok', j.inferred, j.request.type)"
      - name: Installed copy reads a folder cycle (plan.md and tasks.md beside spec.md)
        run: |
          export HOME="$RUNNER_TEMP/home"
          fx="$RUNNER_TEMP/fx2"; d="docs/specs/2026-10-01-x"; mkdir -p "$fx/src" "$fx/$d"; cd "$fx"
          git init -q --initial-branch=main
          git config user.name t; git config user.email t@t
          echo x > src/index.js
          printf '# Spec: x\n\nPhase: development\nStatus: approved\n' > "$d/spec.md"
          printf '# plan\n' > "$d/plan.md"
          printf -- '- [ ] a\n- [ ] b\n' > "$d/tasks.md"
          printf -- '- [x] legacy\n' > /dev/null
          mkdir -p docs/adr; printf 'Status: accepted\n' > docs/adr/0001-a.md; printf 'Status: proposed\n' > docs/adr/0002-b.md
          printf '# A\n\n## Overview\n\n## Structure\n' > ARCHITECTURE.md
          git add -A; git commit -qm init
          node "$HOME/.agents/skills/sdlc/bin/where.js" --root "$fx" --message "continue" > out.json
          node -e "const j=require('./out.json'); const d='docs/specs/2026-10-01-x'; if(j.inferred!=='development'||j.active.path!==d+'/spec.md'||j.signals.plan.path!==d+'/plan.md'||j.signals.todo.path!==d+'/tasks.md'||j.signals.todo.open!==2||j.warnings.length||j.signals.adr.count!==2||j.signals.adr.byStatus.proposed!==1||j.signals.adr.latest.number!==2||!j.signals.architecture.exists||j.signals.architecture.path!=='ARCHITECTURE.md'||j.signals.architecture.sections.length!==2){console.error(JSON.stringify(j,null,1));process.exit(1)}; console.log('ok', j.inferred, j.signals.todo.path)"
          node "$HOME/.agents/skills/sdlc/bin/check-adr.js" --root "$fx" | tee adr.txt; grep -q '^check-adr: docs/adr, 2 ADRs$' adr.txt
      - name: Installed copy reports sdlc-qa-gate for testing and sdlc-debugging for analysis
        run: |
          export HOME="$RUNNER_TEMP/home"; cd "$RUNNER_TEMP/fx"
          node "$HOME/.agents/skills/sdlc/bin/which.js" --phase testing > which.json
          node -e "const j=require('./which.json'); const n=j.phases.testing.installed.map(i=>i.name); if(!n.includes('sdlc-qa-gate')){console.error(JSON.stringify(j,null,1));process.exit(1)}; console.log('ok testing', n.join(','))"
          node "$HOME/.agents/skills/sdlc/bin/which.js" --phase analysis > which2.json
          node -e "const j=require('./which2.json'); const n=j.phases.analysis.installed.map(i=>i.name); if(!n.includes('sdlc-debugging')){console.error(JSON.stringify(j,null,1));process.exit(1)}; console.log('ok analysis', n.join(','))"
  plugin-validate:
    runs-on: ubuntu-latest
    continue-on-error: true   # advisory until proven stable on runners
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - run: npm install -g @anthropic-ai/claude-code && claude plugin validate . && claude plugin validate plugins/sdlc-assist
